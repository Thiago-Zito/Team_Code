<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{url_for('static', path='Pasta_css/stytle_loja-user.css') }}"
    />
    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- FONTE PADRÃO DO SITE -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <title>Produto</title>
  </head>
  <body>
    <main id="main">
      <header id="container_header">
        <div class="inline left-header">
          <a href="/"><h2>Ecommerce</h2></a>
          <a href="/produtos">Loja</a>
          <a href="/sobre">Sobre</a>
          <form action="">
            <label for="pesquisar"
              ><img
                class="icones"
                src="/static/uploads/icons_header/lupa.png"
                alt=""
            /></label>
            <input type="text" id="pesquisar" placeholder="Pesquisar" />
          </form>
        </div>
        <div class="inline right-header">
          <div class="perfil-menu-container">
            <img
              id="foto-perfil"
              src="/static/uploads/icons_header/img-perfil.png"
              alt="imagem de perfil"
              onclick="toggleMenu()"
            />

            <div id="menu-perfil" class="popup-menu">
              <a href="/me/dados_admin">Meus Dados</a>
              <a href="/logout">Sair</a>
            </div>
          </div>

          <script>
            function toggleMenu() {
              const menu = document.getElementById("menu-perfil");
              menu.style.display =
                menu.style.display === "block" ? "none" : "block";
            }

            // Fecha o menu se clicar fora
            window.onclick = function (event) {
              const menu = document.getElementById("menu-perfil");
              const foto = document.getElementById("foto-perfil");
              if (
                !foto.contains(event.target) &&
                !menu.contains(event.target)
              ) {
                menu.style.display = "none";
              }
            };
          </script>
        </div>
      </header>

      <!-- Produtos -->
      <section id="container">
        <div class="fundo_preto">
          <div class="caixa_fundo_preto">
            <h2 class="titulo">Página de Administradores</h2>
            <p class="subtitulo">
              Renove sua presença com bolsas que celebram tanto a <br />
              modernidade quanto a tradição da verdadeira elegância.
            </p>
          </div>
        </div>
        
        <div class="produtos">
          <div class="funcoes">
            <a id="botao-adicionar" href="admin/produto">Adicionar Produto</a>
            <a id="botao-deletar" href="admin/produto-deletar"
              >Deletar Produto</a
            >
          </div>
        </div>
      </section>
    </main>
    <script src="{{ url_for('static', path='js/carrinho.js') }}"></script>
  </body>
</html>
