<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página do Produto</title>
  <link rel="stylesheet" href="style_produto.css">
  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- FONTE PADRÃO DO SITE -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"rel="stylesheet">
</head>

<style>
  body {
  font-family: Arial, sans-serif;
  margin: 0;
  
  background: #f5f7fa;
  color: #333;
}

/* Header */
#container_header {
    position: relative;   /* referência para os filhos */
    margin: 0 auto;
    width: 100%;
    height: 80px;         /* altura fixa do header */
    padding: 15px;
    background-color: #000;
    border-bottom: 1px solid #fff;
}

/* links em linha */
.inline {
    display: flex;
    flex-direction: row;
    gap: 25px;
}

/* bloco da esquerda */
.left-header {
    position: absolute;
    top: 15px;
    left: 80px;  /* você pode mudar esse valor */
    display: flex;
    align-items: center;
    gap: 20px;
}

.left-header h2 {
    font-size: 25px;
    line-height: 1.6;
    color: white;
}

.left-header a {
    font-size: 17px;
    text-decoration: none;
    font-weight: 500;
    color: white;
}

/* pesquisa */
#pesquisar {
    background-color: transparent;
    border: none;
    color: white;
}

/* bloco da direita */
.right-header {
    position: absolute;
    top: 25px;
    right: 80px;  /* você pode mudar esse valor */
    display: flex;
    align-items: center;
    gap: 20px;
}

.right-header form input {
    border: none;
}

.right-header a {
    font-size: 17px;
    text-decoration: none;
    font-weight: 500;
    color: white;
}

.icones {
    width: 25px;
}

.produto-container {
  position: relative;
  top: 150px;
  display: flex;
  gap: 40px;
  max-width: 1200px;
  margin: 0 auto;
}

/* Galeria de imagens */
.produto-imagens {
flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.grid-imagens {
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* 2 colunas */
  grid-template-rows: repeat(2, 1fr);    /* 2 linhas */
  gap: 1px;
  max-width: 500px;
  width: 100%;
}

.grid-imagens img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: 1px solid #ccc;
}

.imagem-principal img {
  width: 100%;
  max-width: 500px;
  border: 1px solid #ccc;
  display: block;
}

.miniaturas {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.miniaturas img {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border: 1px solid #ccc;
  cursor: pointer;
}

/* Informações */
.produto-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.produto-nome {
  font-size: 28px;
  margin: 0;
}

.produto-preco {
  font-size: 24px;
  font-weight: bold;
}

.parcelamento {
  font-size: 14px;
  color: #666;
}

/* Cores */
.produto-cores {
  display: flex;
  align-items: center;
  gap: 10px;
}

.produto-cores .cor {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: inline-block;
  border: 1px solid #333;
  cursor: pointer;
}

/* Quantidade */
.produto-quantidade .quantidade-controle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 5px;
}

.quantidade-controle button {
  width: 30px;
  height: 30px;
  border: 1px solid #333;
  background: none;
  cursor: pointer;
}

.quantidade-controle input {
  width: 40px;
  text-align: center;
  border: 1px solid #333;
}

/* Botão */
.btn-comprar {
  background: #000;
  color: #fff;
  padding: 10px 1px; /* 10px vertical, 20px horizontal */
  border: none;
  font-size: 16px;
  cursor: pointer;
  margin-top: 10px;
  width: 200px;
}

.btn-comprar:hover {
  background-color: #000;
  color: #fff;
}

/* Links extras */
.produto-links {
  display: flex;
  gap: 20px;
  margin-top: 10px;
}

.produto-links a {
  font-size: 14px;
  color: #666;
  text-decoration: none;
}

.produto-links a:hover {
  text-decoration: underline;
}

/* Responsivo */
@media (max-width: 768px) {
  .produto-container {
    flex-direction: column;
  }
}



</style>

<body>
  <!-- Header -->
    <main id="container_main">
        <header id="container_header">
            <div class="inline left-header">
                <a href="home.html"><h2>Ecommerce</h2></a>
                <a href="loja.html">Loja</a>
                <a href="">Sobre</a>
                <form action="">
                    <label for="pesquisar"><img class="icones" src="./img/icons_header/lupa.png" alt=""></label>
                    <input type="text" id="pesquisar" placeholder="Pesquisar">
                </form>
            </div>
            <div class="inline right-header">
                <a href=""><img src="./img/icons_header/coracao.png" alt=""></a>
                <a href=""><img src="./img/icons_header/icon_carrinho.png" alt=""></a>
                <a href="">Login</a>
            </div>
        </header>
  <div class="produto-container">
    
    <!-- Galeria de imagens -->
            <div class="produto-imagens">
                <div class="grid-imagens">
                    <img src="/View/templates/img/{{imagem}}" alt="Foto 1">
                    <img src="./img/louis-vuitton-bolsa-carryall-vibe1.avif" alt="Foto 2">
                    <img src="./img/louis-vuitton-bolsa-carryall-vibe2.avif" alt="Foto 3">
                    <img src="./img/louis-vuitton-bolsa-carryall-vibe3.avif" alt="Foto 4">
                </div>
            </div>

    <!-- Informações do produto -->
    <div class="produto-info">
      <h1 class="produto-nome">{{produto.nome}}</h1>
      <p class="produto-preco">{{produto.preco}}</p>
      <p class="parcelamento">ou 4x de R$ 6.725 sem juros</p>

      <!-- Cores -->
      <div class="produto-cores">
        <p>Cor:</p>
        <span class="cor" style="background-color: #d28c5c;"></span>
        <span class="cor" style="background-color: #000;"></span>
      </div>

      <!-- Quantidade -->
      <div class="produto-quantidade">
        <p>Quantidade:</p>
        <div class="quantidade-controle">
          <button>-</button>
          <input type="text" value="1">
          <button>+</button>
        </div>
      </div>

      <!-- Botão -->
      <button class="btn-comprar">Adicionar ao carrinho</button>

      <!-- Links extras -->
      <div class="produto-links">
        <a href="#">Frete padrão grátis</a>
        <a href="#">Devoluções gratuitas</a>
      </div>
    </div>

  </div>

</body>
</html>
