<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- FONTE PADRÃO DO SITE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>Home</title>
</head>
<body>
    <main id="container_main">
        <header id="container_header">
            <div class="inline left-header">
                <h2>Ecommerce</h2>
                <a href="">Loja</a>
                <a href="">Sobre</a>
                <form action="">
                    <label for="pesquisar"><img class="icones" src="./img/icons_header/procurar.png" alt=""></label>
                    <input type="text" id="pesquisar" placeholder="pesquisar">
                </form>
            </div>
            <div class="inline right-header">
                <a href=""><img src="./img/icons_header/coracao.png" alt=""></a>
                <a href=""><img src="./img/icons_header/icon_carrinho.png" alt=""></a>
                <a href="">Login</a>
            </div>
        </header>
        <hr>
        <section id="Topo">
            <div class="container_topo">
                <div class="txt_topo">
                    <h2>Bolsas que carregam muito mais<br>que estilo.</h1>
                    <p>Elegância não está nos detalhes, mas no que você leva<br>consigo.</p>
                    <a href="">Comprar</a>
                </div>
                <div class="img_topo">
                    <h2>Mais que um acessório</h2>
                </div>
            </div> 
        </section>
        <section id="Meio">
            <div class="container_meio">
                <div class="txt_meio">

                </div>
                <div class="img_meio">

                </div>
            </div>
        </section>
        <section id="Base">
            <div class="container_base">
                <div class="img_principal">

                </div>
                <div class="grid-container">
                    <div class="img-base"><img src="" alt=""></div>
                    <div class="img-base"><img src="" alt=""></div>
                    <div class="img-base"><img src="" alt=""></div>
                    <div class="img-base"><img src="" alt=""></div>
                </div>
            </div>
            <button class="btn-fundo"></button>
        </section>
        <footer>
            <div class="container_footer">
                <div class="left-footer">
                    <h2>

                    </h2>
                    <p>

                    </p>
                    <form action="">
                        <input type="email" placeholder="Adicionar Email">
                    </form>
                </div>
                <div class="right-footer">
                    <div class="coluna"></div>
                    <div class="coluna"></div>
                    <div class="coluna"></div>
                </div>
            </div>
        </footer>
    </main>
</body>
</html>
